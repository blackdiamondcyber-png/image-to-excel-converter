<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="102" fill="#0F1117"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="turbanMain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="turbanLight" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#D4956B"/>
      <stop offset="100%" stop-color="#C07844"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1D6F3E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="48" y="48" width="416" height="416" rx="80"/>
    </clipPath>
  </defs>

  <!-- Inner rounded background -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <!-- === BODY / SHIRT === -->
    <ellipse cx="256" cy="500" rx="130" ry="90" fill="url(#shirt)"/>
    <!-- Collar -->
    <path d="M218,366.72 L256,386.72 L294,366.72" stroke="#15803D" stroke-width="3" fill="none"/>

    <!-- Neck -->
    <rect x="224" y="348.72" width="64" height="42" rx="8" fill="url(#skin)"/>
    <!-- Neck shadow -->
    <ellipse cx="256" cy="350.72" rx="32" ry="6" fill="#A0673A" opacity="0.3"/>

    <!-- Ears -->
    <ellipse cx="188" cy="290.72" rx="14" ry="18" fill="#C07844"/>
    <ellipse cx="188" cy="290.72" rx="8" ry="12" fill="#B06A3A" opacity="0.4"/>
    <ellipse cx="324" cy="290.72" rx="14" ry="18" fill="#C07844"/>
    <ellipse cx="324" cy="290.72" rx="8" ry="12" fill="#B06A3A" opacity="0.4"/>

    <!-- === FACE === -->
    <ellipse cx="256" cy="286.72" rx="66" ry="78" fill="url(#skin)"/>

    <!-- Eyes — white sclera -->
    <ellipse cx="232" cy="280.72" rx="12" ry="11" fill="white"/>
    <ellipse cx="280" cy="280.72" rx="12" ry="11" fill="white"/>
    <!-- Iris -->
    <circle cx="234" cy="282.72" r="6.5" fill="#3B2510"/>
    <circle cx="282" cy="282.72" r="6.5" fill="#3B2510"/>
    <!-- Pupil -->
    <circle cx="235" cy="282.72" r="3" fill="#1A1005"/>
    <circle cx="283" cy="282.72" r="3" fill="#1A1005"/>
    <!-- Eye shine -->
    <circle cx="237" cy="279.72" r="2" fill="white" opacity="0.9"/>
    <circle cx="285" cy="279.72" r="2" fill="white" opacity="0.9"/>

    <!-- Eyebrows -->
    <path d="M218,264.72 Q232,254.72000000000003 246,262.72" stroke="#2D1810" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M266,262.72 Q280,254.72000000000003 294,264.72" stroke="#2D1810" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M254,288.72 Q268,308.72 258,310.72 Q250,312.72 248,306.72" stroke="#A0673A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Mustache -->
    <path d="M226,318.72 Q242,328.72 256,318.72 Q270,328.72 286,318.72" fill="#1A0E06"/>
    <!-- Mustache curls -->
    <path d="M226,318.72 Q220,320.72 222,314.72" stroke="#1A0E06" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M286,318.72 Q292,320.72 290,314.72" stroke="#1A0E06" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M234,328.72 Q256,342.72 278,328.72" stroke="#8B4020" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Lower lip hint -->
    <path d="M242,334.72 Q256,340.72 270,334.72" fill="#C0785E" opacity="0.4"/>

    <!-- === TURBAN — flowing folds with spreadsheet grid === -->

    <!-- Turban main dome -->
    <path d="M166,254.72000000000003 Q161,166.72000000000003 256,146.72000000000003 Q351,166.72000000000003 346,254.72000000000003" fill="url(#turbanMain)"/>

    <!-- Turban fold layers (flowing wraps) -->
    <!-- Top fold -->
    <path d="M186,171.72000000000003 Q256,151.72000000000003 326,171.72000000000003" stroke="url(#turbanLight)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Upper-mid fold -->
    <path d="M174,196.72000000000003 Q256,178.72000000000003 338,196.72000000000003" stroke="#22C55E" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- Mid fold -->
    <path d="M168,220.72000000000003 Q256,204.72000000000003 344,220.72000000000003" stroke="#16A34A" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Lower fold (band across forehead) -->
    <path d="M166,244.72000000000003 Q256,230.72000000000003 346,244.72000000000003" stroke="#15803D" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M170,244.72000000000003 Q256,232.72000000000003 342,244.72000000000003" stroke="#22C55E" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Turban side drapes -->
    <ellipse cx="178" cy="254.72000000000003" rx="22" ry="40" fill="#16A34A"/>
    <ellipse cx="334" cy="254.72000000000003" rx="22" ry="40" fill="#16A34A"/>

    <!-- === SPREADSHEET GRID on turban === -->
    <!-- Horizontal grid lines across folds -->
    <line x1="196" y1="178.72000000000003" x2="316" y2="178.72000000000003" stroke="white" stroke-width="1.2" opacity="0.35"/>
    <line x1="184" y1="196.72000000000003" x2="328" y2="196.72000000000003" stroke="white" stroke-width="1.2" opacity="0.35"/>
    <line x1="176" y1="214.72000000000003" x2="336" y2="214.72000000000003" stroke="white" stroke-width="1.2" opacity="0.3"/>

    <!-- Vertical grid lines -->
    <line x1="226" y1="156.72000000000003" x2="222" y2="236.72000000000003" stroke="white" stroke-width="1.2" opacity="0.3"/>
    <line x1="256" y1="148.72000000000003" x2="256" y2="236.72000000000003" stroke="white" stroke-width="1.2" opacity="0.35"/>
    <line x1="286" y1="156.72000000000003" x2="290" y2="236.72000000000003" stroke="white" stroke-width="1.2" opacity="0.3"/>

    <!-- Cell values woven into turban -->
    <text x="240" y="191.72000000000003" font-family="monospace" font-size="13" fill="white" opacity="0.5" text-anchor="middle">A1</text>
    <text x="272" y="191.72000000000003" font-family="monospace" font-size="13" fill="white" opacity="0.5" text-anchor="middle">B2</text>
    <text x="240" y="210.72000000000003" font-family="monospace" font-size="12" fill="white" opacity="0.4" text-anchor="middle">$</text>
    <text x="272" y="210.72000000000003" font-family="monospace" font-size="12" fill="white" opacity="0.4" text-anchor="middle">42</text>

    <!-- Turban jewel/pin centered on forehead band -->
    <circle cx="256" cy="242.72000000000003" r="10" fill="#0D5C2A"/>
    <circle cx="256" cy="242.72000000000003" r="7" fill="#4ADE80"/>
    <circle cx="254" cy="239.72000000000003" r="2.5" fill="white" opacity="0.85"/>

  </g>
</svg>