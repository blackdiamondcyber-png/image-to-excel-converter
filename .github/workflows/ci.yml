name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Plain `npm ci`, the same resolution Vercel runs. This used to be
      # `npm install --legacy-peer-deps 2>/dev/null || true`, which hid an
      # ERESOLVE failure and kept CI green for six months while every Vercel
      # deployment failed.
      - run: npm ci

      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SKIP_ENV: "true"
